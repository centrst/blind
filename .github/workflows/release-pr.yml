name: Release PR

# Manual until an organization owner allows Actions to create pull requests. Then
# add `push: branches: [main]` back here so pending changesets open the release PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Look for release notes
        id: notes
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readdirSync } from 'node:fs';
          const hasNotes = readdirSync('.changeset').some((name) => name.endsWith('.md') && name !== 'README.md');
          appendFileSync(process.env.GITHUB_OUTPUT, `pending=${hasNotes}\n`);
          JS
      - name: Update the release PR without publishing
        if: steps.notes.outputs.pending == 'true'
        id: changesets
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version:release
          commit-message: Prepare the next release
          pr-title: Prepare the next release
          pr-draft: create
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      # Explicit dispatches run the gates against the generated branch instead.
      - name: Run CI on the release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          branch="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          gh workflow run ci.yml --ref "$branch"
          gh workflow run python-dependencies.yml --ref "$branch"
