name: Python dependencies

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '19 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m unittest discover -s test -p audit_python_test.py
      - run: python scripts/audit-python.py
