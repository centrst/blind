name: Release

# Publishes @centrst/blind to npm with provenance when a version tag is pushed.
#
# Authentication is npm trusted publishing: npm accepts the OIDC token GitHub
# issues to this workflow, so no publish credential exists anywhere. The trusted
# publisher is configured on the package's settings page on npmjs.com and names
# this repository, this workflow file and the `release` environment. RELEASING.md
# says how to set it up; the package has to exist on npm before that page does.
#
# The `release` environment is where the protected release authorization lives:
# its required reviewers in the repository settings approve each run before the
# publish job starts.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # pnpm test alone takes about 18 minutes on a laptop
    environment: release
    permissions:
      id-token: write # the OIDC token npm trusts, and provenance
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag $TAG does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: npm that supports trusted publishing
        run: npm install -g npm@11 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --provenance --access public
