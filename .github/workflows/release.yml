name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [next, stable]
        default: next
        required: true
      verified_sha:
        description: Full commit SHA whose local pnpm verify report you reviewed
        type: string
        required: true

permissions:
  contents: read

env:
  npm_config_registry: https://registry.npmjs.org

# Serialize version allocation and publishing across both channels.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.next.outputs.version || steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a reviewed commit on main and a valid release version
        id: check
        env:
          CHANNEL: ${{ inputs.channel || 'stable' }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          pnpm exec tsx scripts/check-release.ts
      - name: Allocate the next prerelease version
        if: steps.check.outputs.tag == 'next'
        id: next
        run: pnpm publish:next --prepare
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Pack the tested build
        env:
          RELEASE_VERSION: ${{ steps.next.outputs.version || steps.check.outputs.version }}
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
        run: |
          mkdir -p .local/release
          npm pack --ignore-scripts --json --pack-destination .local/release > .local/pack.json
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          const [pack] = JSON.parse(readFileSync('.local/pack.json', 'utf8'));
          if (pack.version !== process.env.RELEASE_VERSION) throw new Error('Packed version differs from release version.');
          const release = { version: pack.version, tag: process.env.RELEASE_TAG, source: process.env.GITHUB_SHA, integrity: pack.integrity };
          writeFileSync('.local/release/release.json', JSON.stringify(release, null, 2) + '\n');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Package ${release.version}\n\nTag ${release.tag}\n\nSource ${release.source}\n`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: .local/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .local/release
      - name: Publish the tested tarball with provenance
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm publish ".local/release/centrst-blind-${RELEASE_VERSION}.tgz" \
            --tag "$RELEASE_TAG" --access public --provenance --ignore-scripts \
            --registry=https://registry.npmjs.org
      - name: Check the published version and integrity
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          npm view "@centrst/blind@${RELEASE_VERSION}" --json --registry=https://registry.npmjs.org > .local/published.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const expected = JSON.parse(readFileSync('.local/release/release.json', 'utf8'));
          const actual = JSON.parse(readFileSync('.local/published.json', 'utf8'));
          if (actual.version !== expected.version || actual.dist.integrity !== expected.integrity) {
            throw new Error('Published package differs from the tested tarball.');
          }
          if (Object.keys(actual.dependencies ?? {}).length !== 0 || !actual.bin?.blind || !actual.bin?.unblind) {
            throw new Error('Published dependencies or command entries differ from the core package.');
          }
          JS
