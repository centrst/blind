packages:
  - ner
allowBuilds:
  esbuild: true
  # Blocks onnxruntime-node's postinstall (script/install.js), which downloads
  # files at install time that the npm tarball does not bundle. In 1.31.1 that
  # is only the CUDA and TensorRT providers on linux/x64, fetched from NuGet.
  # The CPU runtime blind-ner uses ships prebuilt inside the tarball under
  # bin/napi-v6 for darwin/arm64, linux/x64, linux/arm64, win32/x64 and
  # win32/arm64, and the NER package loads it from there when a model loads.
  # Nothing is downloaded for it. Intel macOS has no binary in this release.
  onnxruntime-node: false

# GHSA-g3hv-75wg-m249: the lint and mutation tools still request minimatch 10.
# Use the patched matcher until those tools update their dependency ranges.
overrides:
  "minimatch@>=7.0.0 <11.0.1": 11.0.5
  # typed-rest-client pins a vulnerable qs version; 6.16.1 fixes its four advisories.
  "typed-rest-client@2.3.1>qs": 6.16.1
